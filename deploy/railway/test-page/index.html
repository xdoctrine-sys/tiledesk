<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiledesk trial - synthetic widget conversation test page</title>
  <!--
    Synthetic test page for the Tiledesk trial only.
    No existing website or Chatwoot/Tarshli asset is touched.

    The widget bundle, its config and its API all come from the trial proxy
    (tiledesk-trial-proxy), never from tiledesk.com.
  -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px 32px; }
    h1 { font-size: 18px; }
    #log { font-size: 12px; color: #333; max-height: 40vh; overflow: auto; background: #f5f5f5; padding: 12px; border-radius: 6px; }
    code { background: #eee; padding: 1px 4px; border-radius: 3px; }
  </style>
  <script>
    window.tiledeskSettings = {
      projectid: "6af5f0d2244c36000e8ffef2",
      widgetTitle: "Tarshli Tiledesk Trial",
      align: "right",
      isLogEnabled: true,
      logLevel: "DEBUG",
      showAvailableAgents: true,
      calloutTimer: 3
    };

    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://tiledesk-trial-proxy-production.up.railway.app/widget/launch.js";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'tiledesk-jssdk'));

    function logLine(msg) {
      var ul = document.getElementById('log');
      if (!ul) { return; }
      var li = document.createElement('li');
      li.textContent = new Date().toISOString().slice(11, 19) + '  ' + msg;
      ul.appendChild(li);
    }

    window.tileDeskAsyncInit = function () {
      logLine('tileDeskAsyncInit fired - widget SDK ready');
      window.tiledesk.on('onAuthStateChanged', function (e) {
        logLine('onAuthStateChanged event=' + e.detail.event + ' isLogged=' + e.detail.isLogged);
      });
      window.tiledesk.on('onNewConversationComponentInit', function () {
        logLine('onNewConversationComponentInit');
      });
    };
  </script>
</head>
<body>
  <h1>Tiledesk trial - synthetic widget conversation test page</h1>
  <p>
    Only synthetic traffic. Open the launcher at the bottom-right, send a message,
    then reply from the trial dashboard as an agent.
  </p>
  <ul id="log"></ul>
</body>
</html>
