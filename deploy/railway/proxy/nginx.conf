user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    client_max_body_size 200M;

    # Railway's in-container DNS resolver (from /etc/resolv.conf: "nameserver fd12::10").
    # This must be declared so upstream hostnames are resolved at REQUEST time:
    # Railway assigns a service a new private IP on every redeploy, so a
    # startup-time resolution (classic static proxy_pass) goes stale and nginx
    # then dials a dead address -> "upstream timed out (110) while connecting".
    # ipv6=off keeps the IPv4 (A) result, which the railnet0 interface routes.
    resolver [fd12::10] ipv6=off valid=15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Railway terminates TLS at its edge and forwards the original scheme.
    # Using $scheme here would redirect browsers to http://<host>:80.
    map $http_x_forwarded_proto $edge_scheme {
        default $scheme;
        http    http;
        https   https;
    }

    server {
        listen 80;

        # Railway healthcheck endpoint (kept independent of the upstream services).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 $edge_scheme://$host/dashboard/;
        }

        # Every backend below uses a variable proxy_pass so nginx re-resolves the
        # upstream per request (see the resolver note above). Because a variable
        # form does not perform location-prefix stripping, the prefix is removed
        # explicitly with a rewrite, reproducing the upstream compose behaviour
        # of e.g. `proxy_pass http://dashboard:80/`.

        # The original Gemini demo loads its launcher at the host root.
        location = /launch.js {
            return 307 $edge_scheme://$host/dashboard/gemini-original/launch.js$is_args$args;
        }

        location = /widget.js {
            return 307 $edge_scheme://$host/dashboard/gemini-original/widget.js$is_args$args;
        }

        # Serve the presentation separately from the installed production SDK.
        location = /tests/geminy/ {
            rewrite ^ /dashboard/gemini-original/index.html last;
        }

        location = /tests/geminy/index.html {
            rewrite ^ /dashboard/gemini-original/index.html last;
        }

        location ^~ /tests/geminy/assets/ {
            rewrite ^/tests/geminy/assets/(.*)$ /dashboard/gemini-original/assets/$1 last;
        }

        location = /tests/geminy {
            return 308 $edge_scheme://$host/tests/geminy/$is_args$args;
        }

        location = /tests/cloud {
            return 308 $edge_scheme://$host/tests/cloud/$is_args$args;
        }

        # Both upstreams serve static widget files from their web root.
        location ~ ^/tests/(?<variant>geminy|cloud)/ {
            set $widget_upstream http://iconnect-widget-$variant.railway.internal:8080;
            rewrite ^/tests/(?:geminy|cloud)/(.*)$ /$1 break;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_pass $widget_upstream;
        }

        location /dashboard/ {
            set $upstream_dashboard http://tiledesk-trial-dashboard.railway.internal:80;
            rewrite ^/dashboard/?(.*)$ /$1 break;
            proxy_pass $upstream_dashboard;
        }

        location /api/ {
            set $upstream_server http://tiledesk-trial-server.railway.internal:3000;
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass $upstream_server;
        }

        location /ws/ {
            set $upstream_server_ws http://tiledesk-trial-server.railway.internal:3000;
            rewrite ^/ws/?(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $upstream_server_ws;
        }

        location /config.json {
            set $upstream_server_cfg http://tiledesk-trial-server.railway.internal:3000;
            proxy_pass $upstream_server_cfg/chat21/config;
        }

        location /widget/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers Content-Length;
            add_header Access-Control-Allow-Headers Range;

            set $upstream_widget http://tiledesk-trial-widget.railway.internal:80;
            rewrite ^/widget/?(.*)$ /$1 break;
            proxy_pass $upstream_widget;
        }

        location /widget-config.json {
            set $upstream_widget_cfg http://tiledesk-trial-widget.railway.internal:80;
            proxy_pass $upstream_widget_cfg/widget-config.json;
        }

        location /chatapi/ {
            set $upstream_chatapi http://tiledesk-trial-chat21http.railway.internal:8004;
            rewrite ^/chatapi/?(.*)$ /$1 break;
            proxy_pass $upstream_chatapi;
        }

        location /mqws/ {
            set $upstream_mqws http://tiledesk-trial-rabbitmq.railway.internal:15675;
            rewrite ^/mqws/?(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $upstream_mqws;
        }
    }
}
