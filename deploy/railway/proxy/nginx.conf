user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    client_max_body_size 200M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Railway terminates TLS at its edge and forwards the original scheme.
    # Using $scheme here would redirect browsers to http://<host>:80.
    map $http_x_forwarded_proto $edge_scheme {
        default $scheme;
        http    http;
        https   https;
    }

    server {
        listen 80;

        # Railway healthcheck endpoint (kept independent of the upstream services).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 $edge_scheme://$host/dashboard/;
        }

        location /dashboard/ {
            proxy_pass http://tiledesk-trial-dashboard.railway.internal:80/;
        }

        location /api/ {
            proxy_pass http://tiledesk-trial-server.railway.internal:3000/;
        }

        location /ws/ {
            proxy_pass http://tiledesk-trial-server.railway.internal:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /config.json {
            proxy_pass http://tiledesk-trial-server.railway.internal:3000/chat21/config;
        }

        location /widget/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Max-Age 3600;
            add_header Access-Control-Expose-Headers Content-Length;
            add_header Access-Control-Allow-Headers Range;

            proxy_pass http://tiledesk-trial-widget.railway.internal:80/;
        }

        location /widget-config.json {
            proxy_pass http://tiledesk-trial-widget.railway.internal:80/widget-config.json;
        }

        location /chatapi/ {
            proxy_pass http://tiledesk-trial-chat21http.railway.internal:8004/;
        }

        location /mqws/ {
            proxy_pass http://tiledesk-trial-rabbitmq.railway.internal:15675/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
